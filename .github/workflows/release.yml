name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            goos: darwin
            goarch: arm64
          - target: darwin-amd64
            goos: darwin
            goarch: amd64
          - target: linux-amd64
            goos: linux
            goarch: amd64
          - target: linux-arm64
            goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: false

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          CGO_ENABLED=0 go build -trimpath \
            -ldflags "-X main.Version=${VERSION}" \
            -o "dist/mdp-${{ matrix.target }}" \
            .

      - name: Checksum
        working-directory: dist
        run: |
          sha256sum "mdp-${{ matrix.target }}" > "mdp-${{ matrix.target }}.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mdp-${{ matrix.target }}
          path: |
            dist/mdp-${{ matrix.target }}
            dist/mdp-${{ matrix.target }}.sha256

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release-assets
          find artifacts -type f -name 'mdp-*' -exec cp {} release-assets/ \;
          ls -la release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/mdp-darwin-arm64
            release-assets/mdp-darwin-arm64.sha256
            release-assets/mdp-darwin-amd64
            release-assets/mdp-darwin-amd64.sha256
            release-assets/mdp-linux-amd64
            release-assets/mdp-linux-amd64.sha256
            release-assets/mdp-linux-arm64
            release-assets/mdp-linux-arm64.sha256